            live: "#",

            {

            const tagsHTML = p.tags.map(tag => `<span>${tag}</span>`).join('');

            const liveButtonHTML = p.live !== "#" 
                ? `<a href="${p.live}" target="_blank" class="btn primary"><i class="bi bi-globe"></i> Live</a>`
                : `<button class="btn secondary" style="cursor: not-allowed; opacity: 0.6;" disabled><i class="bi bi-globe-americas"></i> Soon</button>`;

            container.innerHTML += `
                <div class="project-card">
                    <div class="project-img-container">
                        <img src="${p.image}" alt="${p.title} Preview Image" loading="lazy">
                    </div>
                    <div class="project-details">
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                        <div class="project-tags">
                            ${tagsHTML}
                        </div>
                        <div class="project-links">

            `;
